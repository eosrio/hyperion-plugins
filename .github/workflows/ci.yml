name: Catalog checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  catalog:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [24, 26]
    steps:
      - uses: actions/checkout@v4
      - name: Validate legacy catalog structure
        if: matrix.node == 26
        run: python3 scripts/validate-catalog.py
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - name: Install pinned metadata tooling
        run: npm ci
      - name: Test versioned catalog acceptance and rejection
        run: npm test
      - name: Validate checked-in compatibility metadata
        run: npm run validate
      - name: Check whitespace
        run: git diff --check $(git hash-object -t tree /dev/null) HEAD
